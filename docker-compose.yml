services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      RESOLVEAI_DB_PATH: /data/resolveai.db
      RESOLVEAI_CORS_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - resolveai-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  resolveai-data:
